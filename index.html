    <script>
        // Global reference to the app instance
        let appInstance = null;

        function app() {
            if (appInstance) return appInstance;

            appInstance = {
                currentPage: 'home',
                mobileMenuOpen: false,
                isAuthenticated: false,
                user: null,
                authToken: localStorage.getItem('authToken') || null,
                API_URL: '/backend/api/index.php',
                wallpapers: [],
                wallpaperFilter: 'all',
                wallpaperSort: 'newest',
                likedWallpapers: new Set(),
                socialStats: {
                    instagram_followers: 0,
                    tiktok_followers: 0
                },
                // Admin Center State
                adminCenterTab: 'users',
                users: [],
                adminWallpapers: [],
                designs: [],
                markets: [],
                productTypes: [],

                init() {
                    // Check authentication
                    this.checkAuth();

                    // Load social stats
                    this.loadSocialStats();

                    // Load initial page
                    this.loadPage('home');

                    // Handle browser back/forward
                    window.addEventListener('popstate', (e) => {
                        if (e.state && e.state.page) {
                            this.currentPage = e.state.page;
                            this.loadPage(e.state.page);
                        }
                    });
                },

                async checkAuth() {
                    try {
                        const formData = new FormData();
                        formData.append('action', 'check_auth');

                        if (this.authToken) {
                            formData.append('token', this.authToken);
                        }

                        const response = await fetch(this.API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        const data = await response.json();
                        this.isAuthenticated = data.authenticated || false;
                        this.user = data.user || null;

                        // If not authenticated, clear token
                        if (!data.authenticated && this.authToken) {
                            this.authToken = null;
                            localStorage.removeItem('authToken');
                        }
                    } catch (error) {
                        console.error('Auth check error:', error);
                    }
                },

                async loadSocialStats() {
                    try {
                        const formData = new FormData();
                        formData.append('action', 'get_social_stats');

                        const response = await fetch(this.API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        const data = await response.json();
                        this.socialStats = {
                            instagram_followers: parseInt(data.instagram_followers) || 0,
                            tiktok_followers: parseInt(data.tiktok_followers) || 0
                        };

                        // Update homepage if it's already loaded
                        if (this.currentPage === 'home') {
                            this.updateSocialCounters();
                        }
                    } catch (error) {
                        console.error('Social stats error:', error);
                    }
                },

                updateSocialCounters() {
                    const instagramCounter = document.getElementById('instagram-counter');
                    const tiktokCounter = document.getElementById('tiktok-counter');

                    if (instagramCounter) {
                        instagramCounter.textContent = this.formatNumber(this.socialStats.instagram_followers);
                    }
                    if (tiktokCounter) {
                        tiktokCounter.textContent = this.formatNumber(this.socialStats.tiktok_followers);
                    }
                },

                formatNumber(num) {
                    if (num >= 1000000) {
                        return (num / 1000000).toFixed(1) + 'M';
                    } else if (num >= 1000) {
                        return (num / 1000).toFixed(1) + 'K';
                    }
                    return num.toString();
                },

                navigateTo(page) {
                    this.currentPage = page;
                    this.loadPage(page);
                    window.history.pushState({ page }, '', `#${page}`);
                    window.scrollTo(0, 0);
                },

                loadPage(page) {
                    switch(page) {
                        case 'home':
                            this.loadHomePage();
                            break;
                        case 'gallery':
                            this.loadGalleryPage();
                            break;
                        case 'shop':
                            this.loadShopPage();
                            break;
                        case 'login':
                            this.loadLoginPage();
                            break;
                        case 'admin':
                            if (this.isAuthenticated) {
                                this.loadAdminPage();
                            } else {
                                this.navigateTo('login');
                            }
                            break;
                        case 'admincenter':
                            if (this.isAuthenticated && this.user?.role === 'admin') {
                                this.loadAdminCenterPage();
                            } else {
                                this.navigateTo('home');
                            }
                            break;
                    }
                },

                async logout() {
                    try {
                        const formData = new FormData();
                        formData.append('action', 'logout');

                        if (this.authToken) {
                            formData.append('token', this.authToken);
                        }

                        await fetch(this.API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        // Clear authentication state
                        this.isAuthenticated = false;
                        this.user = null;
                        this.authToken = null;
                        localStorage.removeItem('authToken');

                        this.navigateTo('home');
                    } catch (error) {
                        console.error('Logout error:', error);
                    }

                async handleLike(wallpaperId) {
                    const isLiked = this.likedWallpapers.has(wallpaperId);

                    // Update UI immediately (optimistic update)
                    if (isLiked) {
                        this.likedWallpapers.delete(wallpaperId);
                    } else {
                        this.likedWallpapers.add(wallpaperId);
                    }

                    // Update the UI elements directly without re-rendering
                    const heartIcon = document.querySelector(`#heart-${wallpaperId}`);
                    const likeCount = document.querySelector(`#like-count-${wallpaperId}`);

                    if (heartIcon) {
                        heartIcon.textContent = isLiked ? '🤍' : '❤️';
                        heartIcon.className = isLiked ? 'text-2xl transition-all' : 'text-2xl transition-all scale-125';
                    }

                    try {
                        const formData = new FormData();
                        formData.append('action', 'toggle_like');
                        formData.append('id', wallpaperId);
                        formData.append('liked', !isLiked ? 'true' : 'false');

                        const response = await fetch(this.API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        const data = await response.json();

                        // Update wallpaper likes count
                        const wallpaper = this.wallpapers.find(w => w.id == wallpaperId);
                        if (wallpaper) {
                            wallpaper.likes = data.likes;
                        }

                        // Update the like count display
                        if (likeCount) {
                            likeCount.textContent = data.likes || 0;
                            likeCount.className = isLiked ? 'text-sm font-bold text-light/70' : 'text-sm font-bold text-orange';
                        }
                    } catch (error) {
                        console.error('Like error:', error);
                        // Revert optimistic update on error
                        if (isLiked) {
                            this.likedWallpapers.add(wallpaperId);
                        } else {
                            this.likedWallpapers.delete(wallpaperId);
                        }
                        if (heartIcon) {
                            heartIcon.textContent = isLiked ? '❤️' : '🤍';
                            heartIcon.className = isLiked ? 'text-2xl transition-all scale-125' : 'text-2xl transition-all';
                        }
                    }
                },

                async handleDownload(wallpaperId) {
                    try {
                        const formData = new FormData();
                        formData.append('action', 'increment_download');
                        formData.append('id', wallpaperId);

                        await fetch(this.API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        // Update local state
                        const wallpaper = this.wallpapers.find(w => w.id == wallpaperId);
                        if (wallpaper) {
                            wallpaper.downloads = (parseInt(wallpaper.downloads) || 0) + 1;
                            this.renderWallpapersGrid();
                        }
                    } catch (error) {
                        console.error('Download error:', error);
                    }
                },

                getSortedWallpapers() {
                    const sorted = [...this.wallpapers];

                    switch (this.wallpaperSort) {
                        case 'newest':
                            return sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                        case 'downloads':
                            return sorted.sort((a, b) => (parseInt(b.downloads) || 0) - (parseInt(a.downloads) || 0));
                        case 'likes':
                            return sorted.sort((a, b) => (parseInt(b.likes) || 0) - (parseInt(a.likes) || 0));
                        default:
                            return sorted;
                    }
                },

                renderAdminProducts() {
                    const grid = document.getElementById('admin-products-grid');
                    if (!grid) return;

                    grid.innerHTML = this.products.map(product => `
                        <div class="bg-dark-700 border border-light/10 rounded-xl overflow-hidden hover:border-orange/50 transition-all">
                            <div class="aspect-square bg-dark-800 relative">
                                ${product.image_path ?
                                    `<img src="${product.image_path}" alt="${product.name}" class="w-full h-full object-cover">` :
                                    '<div class="w-full h-full flex items-center justify-center text-light/40 text-4xl">🛒</div>'
                                }
                            </div>
                            <div class="p-4">
                                <div class="flex items-start justify-between mb-2">
                                    <h3 class="font-bold text-white flex-1 truncate">${product.name}</h3>
                                    ${product.tag ? `<span class="ml-2 px-2 py-1 text-xs font-bold rounded bg-orange/20 text-orange">${product.tag}</span>` : ''}
                                </div>
                                <p class="text-sm text-light/60 mb-2 line-clamp-2">${product.description || '-'}</p>
                                <div class="flex items-center justify-between mb-3">
                                    <span class="text-lg font-bold text-orange">${product.price} ${product.currency}</span>
                                    <span class="text-xs text-light/60 px-2 py-1 rounded bg-blue/20">${product.category}</span>
                                </div>
                                <div class="flex items-center justify-between text-xs text-light/60 mb-3">
                                    <span>Lager: ${product.stock_quantity || 0}</span>
                                    <span class="px-2 py-1 rounded ${product.is_available ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
                                        ${product.is_available ? 'Verfügbar' : 'Nicht verfügbar'}
                                    </span>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="appInstance.showEditProductModal(${product.id})"
                                        class="flex-1 px-3 py-1.5 bg-blue/20 hover:bg-blue/30 text-blue rounded-lg text-sm font-bold transition-colors">
                                        Bearbeiten
                                    </button>
                                    <button onclick="appInstance.confirmDeleteProduct(${product.id}, '${product.name.replace(/'/g, "\\'")}')"
                                        class="flex-1 px-3 py-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-500 rounded-lg text-sm font-bold transition-colors">
                                        Löschen
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                },

                showCreateProductModal() {
                    const modal = document.createElement('div');
                    modal.className = 'fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4 overflow-y-auto';
                    modal.innerHTML = `
                        <div class="bg-dark-700 border border-light/10 rounded-xl p-6 max-w-2xl w-full my-8">
                            <h3 class="text-xl font-bold text-white mb-4">Neues Produkt</h3>
                            <form id="create-product-form" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-bold text-light mb-2">Titel</label>
                                    <input type="text" name="name" required
                                        class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-light mb-2">Beschreibung</label>
                                    <textarea name="description" rows="3"
                                        class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange"></textarea>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-bold text-light mb-2">Preis (EUR)</label>
                                        <input type="number" name="price" step="0.01" min="0" required
                                            class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-light mb-2">Kategorie</label>
                                        <select name="category" required
                                            class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">
                                            <option value="T-Shirt">T-Shirt</option>
                                            <option value="Hoodie">Hoodie</option>
                                            <option value="Sticker">Sticker</option>
                                            <option value="Poster">Poster</option>
                                            <option value="Mug">Mug</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-bold text-light mb-2">Lagerbestand</label>
                                        <input type="number" name="stock_quantity" min="0" value="0"
                                            class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-light mb-2">Tag (optional)</label>
                                        <input type="text" name="tag" placeholder="z.B. Bestseller, New"
                                            class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-light mb-2">Bild hochladen</label>
                                    <input type="file" name="image" accept="image/*"
                                        class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-orange file:text-white file:font-bold hover:file:bg-orange-light">
                                    <p class="mt-1 text-xs text-light/60">JPEG, PNG, GIF oder WebP (max 5MB)</p>
                                </div>
                                <div>
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="checkbox" name="is_available" value="1" checked
                                            class="w-4 h-4 bg-dark-800 border border-light/10 rounded focus:ring-orange">
                                        <span class="text-sm font-bold text-light">Produkt ist verfügbar</span>
                                    </label>
                                </div>
                                <div class="flex gap-3 pt-4">
                                    <button type="submit"
                                        class="flex-1 px-4 py-2 bg-orange hover:bg-orange-light text-white rounded-lg font-bold transition-colors">
                                        Erstellen
                                    </button>
                                    <button type="button" onclick="this.closest('.fixed').remove()"
                                        class="flex-1 px-4 py-2 bg-dark-800 hover:bg-dark-700 text-light rounded-lg font-bold transition-colors">
                                        Abbrechen
                                    </button>
                                </div>
                            </form>
                        </div>
                    `;

                    document.body.appendChild(modal);

                    modal.querySelector('form').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const formData = new FormData(e.target);
                        formData.append('action', 'add_product');

                        try {
                            const response = await fetch(this.API_URL, {
                                method: 'POST',
                                body: formData
                            });

                            const result = await response.json();

                            if (result.success) {
                                modal.remove();
                                await this.loadAdminProducts();
                                alert('Produkt erfolgreich erstellt!');
                            } else {
                                alert(result.error || 'Fehler beim Erstellen des Produkts');
                            }
                        } catch (error) {
                            console.error('Error:', error);
                            alert('Fehler beim Erstellen des Produkts');
                        }
                    });
                },

                showEditProductModal(productId) {
                    const product = this.products.find(p => p.id == productId);
                    if (!product) return;

                    const modal = document.createElement('div');
                    modal.className = 'fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4 overflow-y-auto';
                    modal.innerHTML = `
                        <div class="bg-dark-700 border border-light/10 rounded-xl p-6 max-w-2xl w-full my-8">
                            <h3 class="text-xl font-bold text-white mb-4">Produkt bearbeiten</h3>
                            <form id="edit-product-form" class="space-y-4">
                                <input type="hidden" name="id" value="${product.id}">
                                <div>
                                    <label class="block text-sm font-bold text-light mb-2">Titel</label>
                                    <input type="text" name="name" value="${product.name}" required
                                        class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-light mb-2">Beschreibung</label>
                                    <textarea name="description" rows="3"
                                        class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">${product.description || ''}</textarea>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-bold text-light mb-2">Preis (EUR)</label>
                                        <input type="number" name="price" value="${product.price}" step="0.01" min="0" required
                                            class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-light mb-2">Kategorie</label>
                                        <select name="category" required
                                            class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">
                                            <option value="T-Shirt" ${product.category === 'T-Shirt' ? 'selected' : ''}>T-Shirt</option>
                                            <option value="Hoodie" ${product.category === 'Hoodie' ? 'selected' : ''}>Hoodie</option>
                                            <option value="Sticker" ${product.category === 'Sticker' ? 'selected' : ''}>Sticker</option>
                                            <option value="Poster" ${product.category === 'Poster' ? 'selected' : ''}>Poster</option>
                                            <option value="Mug" ${product.category === 'Mug' ? 'selected' : ''}>Mug</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-bold text-light mb-2">Lagerbestand</label>
                                        <input type="number" name="stock_quantity" value="${product.stock_quantity || 0}" min="0"
                                            class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-light mb-2">Tag (optional)</label>
                                        <input type="text" name="tag" value="${product.tag || ''}" placeholder="z.B. Bestseller, New"
                                            class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">
                                    </div>
                                </div>
                                <div>
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="checkbox" name="is_available" value="1" ${product.is_available ? 'checked' : ''}
                                            class="w-4 h-4 bg-dark-800 border border-light/10 rounded focus:ring-orange">
                                        <span class="text-sm font-bold text-light">Produkt ist verfügbar</span>
                                    </label>
                                </div>
                                <div class="flex gap-3 pt-4">
                                    <button type="submit"
                                        class="flex-1 px-4 py-2 bg-orange hover:bg-orange-light text-white rounded-lg font-bold transition-colors">
                                        Speichern
                                    </button>
                                    <button type="button" onclick="this.closest('.fixed').remove()"
                                        class="flex-1 px-4 py-2 bg-dark-800 hover:bg-dark-700 text-light rounded-lg font-bold transition-colors">
                                        Abbrechen
                                    </button>
                                </div>
                            </form>
                        </div>
                    `;

                    document.body.appendChild(modal);

                    modal.querySelector('form').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const formData = new FormData(e.target);
                        formData.append('action', 'update_product');

                        try {
                            const response = await fetch(this.API_URL, {
                                method: 'POST',
                                body: formData
                            });

                            const result = await response.json();

                            if (result.success) {
                                modal.remove();
                                await this.loadAdminProducts();
                                alert('Produkt erfolgreich aktualisiert!');
                            } else {
                                alert(result.error || 'Fehler beim Aktualisieren des Produkts');
                            }
                        } catch (error) {
                            console.error('Error:', error);
                            alert('Fehler beim Aktualisieren des Produkts');
                        }
                    });
                },

                confirmDeleteProduct(productId, name) {
                    if (confirm(`Möchten Sie das Produkt "${name}" wirklich löschen?`)) {
                        this.deleteProduct(productId);
                    }
                },

                async deleteProduct(productId) {
                    try {
                        const formData = new FormData();
                        formData.append('action', 'delete_product');
                        formData.append('id', productId);

                        const response = await fetch(this.API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        const result = await response.json();

                        if (result.success) {
                            await this.loadAdminProducts();
                            alert('Produkt erfolgreich gelöscht!');
                        } else {
                            alert(result.error || 'Fehler beim Löschen des Produkts');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Fehler beim Löschen des Produkts');
                    }
                },

                // ===== CONFIG TAB =====
                async loadConfigTab() {
                    const content = document.getElementById('admin-center-content');
                    content.innerHTML = `
                        <div>
                            <h2 class="text-2xl font-bold text-white mb-6">Konfiguration</h2>

                            <!-- Social Media Counters -->
                            <div class="bg-dark-700 border border-light/10 rounded-xl p-6 mb-6">
                                <h3 class="text-lg font-bold text-white mb-4">Social Media Counter</h3>
                                <form id="social-stats-form" class="space-y-4">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-sm font-bold text-light mb-2">Instagram Follower</label>
                                            <input type="number" name="instagram_followers" value="${this.socialStats.instagram_followers}" min="0"
                                                class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-bold text-light mb-2">TikTok Follower</label>
                                            <input type="number" name="tiktok_followers" value="${this.socialStats.tiktok_followers}" min="0"
                                                class="w-full px-4 py-2 bg-dark-800 border border-light/10 rounded-lg text-white focus:outline-none focus:border-orange">
                                        </div>
                                    </div>
                                    <div class="pt-4">
                                        <button type="submit"
                                            class="px-6 py-2 bg-orange hover:bg-orange-light text-white rounded-lg font-bold transition-colors">
                                            Speichern
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <!-- Additional Config Sections can be added here -->
                            <div class="bg-dark-700 border border-light/10 rounded-xl p-6">
                                <h3 class="text-lg font-bold text-white mb-4">Weitere Einstellungen</h3>
                                <p class="text-light/60">Hier können weitere Konfigurationsoptionen hinzugefügt werden.</p>
                            </div>
                        </div>
                    `;

                    // Handle social stats form submission
                    document.getElementById('social-stats-form').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const formData = new FormData(e.target);
                        formData.append('action', 'update_social_stats');

                        try {
                            const response = await fetch(this.API_URL, {
                                method: 'POST',
                                body: formData
                            });

                            const result = await response.json();

                            if (result.success) {
                                await this.loadSocialStats();
                                alert('Social Media Counter erfolgreich aktualisiert!');
                            } else {
                                alert(result.error || 'Fehler beim Aktualisieren');
                            }
                        } catch (error) {
                            console.error('Error:', error);
                            alert('Fehler beim Aktualisieren');
                        }
                    });
                },

                formatDate(dateString) {
                    if (!dateString) return '-';
                    const date = new Date(dateString);
                    return date.toLocaleDateString('de-DE', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                },

                loadAdminPage() {
                    document.getElementById('admin-page').innerHTML = `
                        <div class="max-w-7xl mx-auto px-4 py-16">
                            <h1 class="text-4xl font-bold text-white mb-8">Admin Dashboard</h1>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="bg-dark-700 border border-light/10 rounded-2xl p-6">
                                    <h3 class="text-xl font-bold text-white mb-2">Wallpapers</h3>
                                    <p class="text-light/70">Manage gallery wallpapers</p>
                                </div>
                                <div class="bg-dark-700 border border-light/10 rounded-2xl p-6">
                                    <h3 class="text-xl font-bold text-white mb-2">Products</h3>
                                    <p class="text-light/70">Manage shop products</p>
                                </div>
                                <div class="bg-dark-700 border border-light/10 rounded-2xl p-6">
                                    <h3 class="text-xl font-bold text-white mb-2">Stats</h3>
                                    <p class="text-light/70">View statistics</p>
                                </div>
                            </div>
                        </div>
                    `;
                }
            };

            return appInstance;
        }
    </script>
</body>
</html>
