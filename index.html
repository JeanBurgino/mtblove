<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MTB Love - Ride With Passion</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            DEFAULT: '#0a1016',
                            700: '#0f1720',
                            800: '#0d1419',
                            900: '#020b12',
                        },
                        blue: {
                            DEFAULT: '#0268a8',
                            dark: '#025a90',
                        },
                        orange: {
                            DEFAULT: '#ed7f20',
                            light: '#ffb056',
                        },
                        light: '#b1dde9',
                    },
                },
            },
        }
    </script>

    <style>
        body {
            background: #0a1016;
            color: #b1dde9;
            font-family: system-ui, -apple-system, sans-serif;
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="app()" x-init="init()">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-dark-800/90 backdrop-blur-md border-b border-blue/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <a href="#" @click.prevent="navigateTo('home')" class="flex items-center cursor-pointer group">
                    <span class="text-2xl font-black italic tracking-tighter text-blue">
                        MTB <span class="text-orange">Love</span>
                    </span>
                </a>

                <!-- Desktop Navigation -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#" @click.prevent="navigateTo('home')"
                       :class="currentPage === 'home' ? 'text-white' : 'text-light/60 hover:text-white'"
                       class="text-sm font-bold uppercase tracking-wide transition-colors">
                        Home
                    </a>
                    <a href="#" @click.prevent="navigateTo('gallery')"
                       :class="currentPage === 'gallery' ? 'text-white' : 'text-light/60 hover:text-white'"
                       class="text-sm font-bold uppercase tracking-wide transition-colors">
                        Gallery
                    </a>
                    <a href="#" @click.prevent="navigateTo('shop')"
                       :class="currentPage === 'shop' ? 'text-white' : 'text-light/60 hover:text-white'"
                       class="text-sm font-bold uppercase tracking-wide transition-colors">
                        Shop
                    </a>

                    <div class="h-6 w-px bg-light/20 mx-2"></div>

                    <!-- Social Links -->
                    <div class="flex space-x-3">
                        <a href="https://facebook.com/mtblove" target="_blank" rel="noopener noreferrer"
                           class="text-light hover:text-blue transition-colors" aria-label="Facebook">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                            </svg>
                        </a>
                        <a href="https://instagram.com/mtblove" target="_blank" rel="noopener noreferrer"
                           class="text-light hover:text-orange transition-colors" aria-label="Instagram">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                            </svg>
                        </a>
                        <a href="https://tiktok.com/@mtblove" target="_blank" rel="noopener noreferrer"
                           class="text-light hover:text-white transition-colors" aria-label="TikTok">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                            </svg>
                        </a>
                    </div>

                    <!-- Admin Link -->
                    <template x-if="isAuthenticated">
                        <div class="flex items-center gap-3">
                            <a href="#" @click.prevent="navigateTo('admin')" class="text-sm text-light/80 hover:text-white">
                                Admin (<span x-text="user?.username"></span>)
                            </a>
                            <button @click="logout()"
                                class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-xs font-bold text-red-500 transition-colors">
                                🚪 LOGOUT
                            </button>
                        </div>
                    </template>
                    <template x-if="!isAuthenticated">
                        <a href="#" @click.prevent="navigateTo('login')"
                            class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue/10 hover:bg-blue/20 border border-blue/30 text-xs font-bold text-blue transition-colors">
                            👤 LOGIN
                        </a>
                    </template>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden">
                    <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-light p-2 hover:text-white">
                        <span x-show="!mobileMenuOpen">☰</span>
                        <span x-show="mobileMenuOpen">✕</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div x-show="mobileMenuOpen" x-cloak class="md:hidden bg-dark-800 border-b border-light/10">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="#" @click.prevent="navigateTo('home'); mobileMenuOpen = false"
                   class="block px-3 py-3 rounded-lg text-base font-medium text-light hover:bg-blue/20 hover:text-white">
                    Home
                </a>
                <a href="#" @click.prevent="navigateTo('gallery'); mobileMenuOpen = false"
                   class="block px-3 py-3 rounded-lg text-base font-medium text-light hover:bg-blue/20 hover:text-white">
                    Gallery
                </a>
                <a href="#" @click.prevent="navigateTo('shop'); mobileMenuOpen = false"
                   class="block px-3 py-3 rounded-lg text-base font-medium text-light hover:bg-blue/20 hover:text-white">
                    Shop
                </a>
                <div class="h-px bg-light/10 my-2"></div>
                <template x-if="isAuthenticated">
                    <div>
                        <a href="#" @click.prevent="navigateTo('admin'); mobileMenuOpen = false"
                           class="block px-3 py-3 rounded-lg text-base font-medium text-light hover:bg-blue/20 hover:text-white">
                            Admin Dashboard
                        </a>
                        <button @click="logout(); mobileMenuOpen = false"
                                class="w-full text-left px-3 py-3 rounded-lg text-base font-medium text-red-500 hover:bg-red-500/20">
                            Logout
                        </button>
                    </div>
                </template>
                <template x-if="!isAuthenticated">
                    <a href="#" @click.prevent="navigateTo('login'); mobileMenuOpen = false"
                       class="block px-3 py-3 rounded-lg text-base font-medium text-light hover:bg-blue/20 hover:text-white">
                        Login
                    </a>
                </template>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="pt-16">
        <!-- Home Page -->
        <div x-show="currentPage === 'home'" x-cloak>
            <div id="home-page"></div>
        </div>

        <!-- Gallery Page -->
        <div x-show="currentPage === 'gallery'" x-cloak>
            <div id="gallery-page"></div>
        </div>

        <!-- Shop Page -->
        <div x-show="currentPage === 'shop'" x-cloak>
            <div id="shop-page"></div>
        </div>

        <!-- Admin Login -->
        <div x-show="currentPage === 'login'" x-cloak>
            <div id="login-page"></div>
        </div>

        <!-- Admin Dashboard -->
        <div x-show="currentPage === 'admin'" x-cloak>
            <div id="admin-page"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark-800 border-t border-light/10 mt-20">
        <div class="max-w-7xl mx-auto px-4 py-8 text-center">
            <p class="text-light/60 text-sm">
                © 2025 MTB Love - Made with ❤️ for the MTB Community
            </p>
        </div>
    </footer>

    <script>
        function app() {
            return {
                currentPage: 'home',
                mobileMenuOpen: false,
                isAuthenticated: false,
                user: null,
                API_URL: '/backend/api/index.php',
                wallpapers: [],
                wallpaperFilter: 'all',
                wallpaperSort: 'newest',
                likedWallpapers: new Set(),

                init() {
                    // Check authentication
                    this.checkAuth();

                    // Load initial page
                    this.loadPage('home');

                    // Handle browser back/forward
                    window.addEventListener('popstate', (e) => {
                        if (e.state && e.state.page) {
                            this.currentPage = e.state.page;
                            this.loadPage(e.state.page);
                        }
                    });
                },

                async checkAuth() {
                    try {
                        const formData = new FormData();
                        formData.append('action', 'check_auth');

                        const response = await fetch(this.API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        const data = await response.json();
                        this.isAuthenticated = data.authenticated || false;
                        this.user = data.user || null;
                    } catch (error) {
                        console.error('Auth check error:', error);
                    }
                },

                navigateTo(page) {
                    this.currentPage = page;
                    this.loadPage(page);
                    window.history.pushState({ page }, '', `#${page}`);
                    window.scrollTo(0, 0);
                },

                loadPage(page) {
                    switch(page) {
                        case 'home':
                            this.loadHomePage();
                            break;
                        case 'gallery':
                            this.loadGalleryPage();
                            break;
                        case 'shop':
                            this.loadShopPage();
                            break;
                        case 'login':
                            this.loadLoginPage();
                            break;
                        case 'admin':
                            if (this.isAuthenticated) {
                                this.loadAdminPage();
                            } else {
                                this.navigateTo('login');
                            }
                            break;
                    }
                },

                async logout() {
                    try {
                        const formData = new FormData();
                        formData.append('action', 'logout');

                        await fetch(this.API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        this.isAuthenticated = false;
                        this.user = null;
                        this.navigateTo('home');
                    } catch (error) {
                        console.error('Logout error:', error);
                    }
                },

                loadHomePage() {
                    document.getElementById('home-page').innerHTML = `
                        <div class="relative overflow-hidden py-24 lg:py-32 flex flex-col items-center text-center px-4">
                            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-blue/20 blur-[100px] rounded-full -z-10 pointer-events-none mix-blend-screen"></div>
                            <div class="absolute bottom-0 right-1/4 w-[400px] h-[400px] bg-orange/10 blur-[80px] rounded-full -z-10 pointer-events-none mix-blend-screen"></div>

                            <div class="inline-flex items-center space-x-2 bg-blue/10 border border-blue/30 rounded-full px-4 py-1.5 mb-8">
                                <span style="color: #ed7f20; font-size: 14px;">❤️</span>
                                <span class="text-light text-xs font-bold tracking-wide uppercase">MTB Community Page</span>
                            </div>

                            <h1 class="text-5xl md:text-8xl font-black italic tracking-tighter mb-6 text-white">
                                RIDE WITH <br />
                                <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange via-orange-light to-orange">
                                    PASSION
                                </span>
                            </h1>

                            <p class="text-xl text-light/80 max-w-2xl mb-10 font-light">
                                The home base for everyone who loves biking. Memes, art, and good vibes only.
                            </p>

                            <div class="flex gap-4 flex-wrap justify-center">
                                <a href="#" @click.prevent="navigateTo('gallery')"
                                    class="px-8 py-4 bg-orange hover:bg-orange-light text-white rounded-xl font-bold transition-all hover:scale-105 shadow-[0_0_20px_-5px] shadow-orange inline-block">
                                    Gallery
                                </a>
                                <a href="#" @click.prevent="navigateTo('shop')"
                                    class="px-8 py-4 bg-blue/10 hover:bg-blue/20 border border-blue/50 text-light rounded-xl font-bold transition-all inline-block">
                                    Shop
                                </a>
                            </div>
                        </div>

                        <!-- Features -->
                        <div class="max-w-7xl mx-auto px-4 py-16">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div class="bg-dark-700 border border-light/10 rounded-2xl p-6 hover:border-orange/50 transition-all group">
                                    <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">🎨</div>
                                    <h3 class="text-xl font-bold mb-2 text-white">Gallery</h3>
                                    <p class="text-light/70">Free and premium wallpapers for your setup</p>
                                </div>
                                <div class="bg-dark-700 border border-light/10 rounded-2xl p-6 hover:border-orange/50 transition-all group">
                                    <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">🛒</div>
                                    <h3 class="text-xl font-bold mb-2 text-white">Shop</h3>
                                    <p class="text-light/70">Merch, stickers, and more for MTB enthusiasts</p>
                                </div>
                                <div class="bg-dark-700 border border-light/10 rounded-2xl p-6 hover:border-orange/50 transition-all group">
                                    <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">❤️</div>
                                    <h3 class="text-xl font-bold mb-2 text-white">Community</h3>
                                    <p class="text-light/70">Share your passion with like-minded riders</p>
                                </div>
                            </div>
                        </div>
                    `;
                },

                loadGalleryPage() {
                    document.getElementById('gallery-page').innerHTML = `
                        <div class="max-w-7xl mx-auto px-4 py-16">
                            <!-- Header -->
                            <div class="mb-8">
                                <h1 class="text-4xl md:text-5xl font-black italic text-white mb-2">
                                    WALLPAPER GALLERY
                                </h1>
                                <p class="text-light/70">
                                    Wallpapers for your setup
                                </p>
                            </div>

                            <!-- Sort Options -->
                            <div class="flex flex-wrap gap-3 mb-8" id="sortButtons"></div>

                            <!-- Loading State -->
                            <div id="loading" class="text-center py-20">
                                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-orange"></div>
                                <p class="mt-4 text-light/60">Loading wallpapers...</p>
                            </div>

                            <!-- Wallpaper Grid -->
                            <div id="wallpaperGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" style="display: none;"></div>
                        </div>
                    `;
                    this.loadWallpapers();
                },

                async loadWallpapers() {
                    try {
                        const formData = new FormData();
                        formData.append('action', 'get_wallpapers');

                        const response = await fetch(this.API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        const wallpapers = await response.json();
                        this.wallpapers = wallpapers;
                        this.renderWallpapersAll();

                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('wallpaperGrid').style.display = 'grid';
                    } catch (error) {
                        console.error('Error loading wallpapers:', error);
                        document.getElementById('loading').innerHTML = '<p class="text-red-500">Error loading wallpapers</p>';
                    }
                },

                async handleLike(wallpaperId) {
                    const isLiked = this.likedWallpapers.has(wallpaperId);

                    // Update UI immediately (optimistic update)
                    if (isLiked) {
                        this.likedWallpapers.delete(wallpaperId);
                    } else {
                        this.likedWallpapers.add(wallpaperId);
                    }

                    // Update the UI elements directly without re-rendering
                    const heartIcon = document.querySelector(`#heart-${wallpaperId}`);
                    const likeCount = document.querySelector(`#like-count-${wallpaperId}`);

                    if (heartIcon) {
                        heartIcon.textContent = isLiked ? '🤍' : '❤️';
                        heartIcon.className = isLiked ? 'text-2xl transition-all' : 'text-2xl transition-all scale-125';
                    }

                    try {
                        const formData = new FormData();
                        formData.append('action', 'toggle_like');
                        formData.append('id', wallpaperId);
                        formData.append('liked', !isLiked ? 'true' : 'false');

                        const response = await fetch(this.API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        const data = await response.json();

                        // Update wallpaper likes count
                        const wallpaper = this.wallpapers.find(w => w.id == wallpaperId);
                        if (wallpaper) {
                            wallpaper.likes = data.likes;
                        }

                        // Update the like count display
                        if (likeCount) {
                            likeCount.textContent = data.likes || 0;
                            likeCount.className = isLiked ? 'text-sm font-bold text-light/70' : 'text-sm font-bold text-orange';
                        }
                    } catch (error) {
                        console.error('Like error:', error);
                        // Revert optimistic update on error
                        if (isLiked) {
                            this.likedWallpapers.add(wallpaperId);
                        } else {
                            this.likedWallpapers.delete(wallpaperId);
                        }
                        if (heartIcon) {
                            heartIcon.textContent = isLiked ? '❤️' : '🤍';
                            heartIcon.className = isLiked ? 'text-2xl transition-all scale-125' : 'text-2xl transition-all';
                        }
                    }
                },

                async handleDownload(wallpaperId) {
                    try {
                        const formData = new FormData();
                        formData.append('action', 'increment_download');
                        formData.append('id', wallpaperId);

                        await fetch(this.API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        // Update local state
                        const wallpaper = this.wallpapers.find(w => w.id == wallpaperId);
                        if (wallpaper) {
                            wallpaper.downloads = (parseInt(wallpaper.downloads) || 0) + 1;
                            this.renderWallpapersGrid();
                        }
                    } catch (error) {
                        console.error('Download error:', error);
                    }
                },

                getSortedWallpapers() {
                    const sorted = [...this.wallpapers];

                    switch (this.wallpaperSort) {
                        case 'newest':
                            return sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                        case 'downloads':
                            return sorted.sort((a, b) => (parseInt(b.downloads) || 0) - (parseInt(a.downloads) || 0));
                        case 'likes':
                            return sorted.sort((a, b) => (parseInt(b.likes) || 0) - (parseInt(a.likes) || 0));
                        default:
                            return sorted;
                    }
                },

                renderWallpapersFilters() {
                    const filters = [
                        { value: 'all', label: 'All' },
                        { value: 'free', label: 'Free' },
                        { value: 'premium', label: 'Premium' }
                    ];

                    const filterButtons = document.getElementById('filterButtons');
                    if (filterButtons) {
                        filterButtons.innerHTML = filters.map(f => `
                            <button
                                onclick="app().setWallpaperFilter('${f.value}')"
                                class="px-4 py-2 rounded-lg font-bold text-sm transition-all ${
                                    this.wallpaperFilter === f.value
                                        ? 'bg-orange text-white'
                                        : 'bg-dark-700 text-light/60 hover:text-white border border-light/10'
                                }"
                            >
                                ${f.label}
                            </button>
                        `).join('');
                    }
                },

                renderWallpapersSortButtons() {
                    const sorts = [
                        { value: 'newest', label: 'Newest' },
                        { value: 'downloads', label: 'Most Downloads' },
                        { value: 'likes', label: 'Most Likes' }
                    ];

                    const sortButtons = document.getElementById('sortButtons');
                    if (sortButtons) {
                        sortButtons.innerHTML = sorts.map(s => `
                            <button
                                onclick="app().setWallpaperSort('${s.value}')"
                                class="px-5 py-2.5 rounded-lg font-bold text-sm transition-all ${
                                    this.wallpaperSort === s.value
                                        ? 'bg-orange text-white shadow-lg shadow-orange/30'
                                        : 'bg-dark-700 text-light/60 hover:text-white border border-light/10 hover:border-orange/30'
                                }"
                            >
                                ${s.label}
                            </button>
                        `).join('');
                    }
                },

                renderWallpapersGrid() {
                    const sorted = this.getSortedWallpapers();
                    const grid = document.getElementById('wallpaperGrid');

                    if (grid) {
                        grid.innerHTML = sorted.map(wallpaper => {
                            const isLiked = this.likedWallpapers.has(wallpaper.id);

                            return `
                                <div class="group relative bg-dark-700 rounded-2xl overflow-hidden border border-light/10 hover:border-orange/50 transition-all hover:-translate-y-1">
                                    <!-- Image -->
                                    <div class="aspect-[3/4] bg-dark relative flex items-center justify-center">
                                        ${wallpaper.file_path ? `
                                            <img
                                                src="${wallpaper.file_path}"
                                                alt="${wallpaper.title}"
                                                class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                                                onerror="this.style.display='none'"
                                            />
                                        ` : ''}

                                        <!-- Download Overlay -->
                                        <div class="absolute inset-0 bg-blue/80 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                            <a
                                                href="${wallpaper.file_path}"
                                                download="${wallpaper.title}"
                                                onclick="app().handleDownload(${wallpaper.id})"
                                                class="bg-white text-blue px-6 py-3 rounded-full font-bold flex items-center gap-2 hover:bg-light transition-all"
                                            >
                                                <span class="text-2xl" style="line-height: 1; display: inline-block;">⬇️</span>
                                                Download
                                            </a>
                                        </div>
                                    </div>

                                    <!-- Info -->
                                    <div class="p-4 bg-dark-700">
                                        <h3 class="font-bold text-lg text-white mb-3 truncate">${wallpaper.title}</h3>
                                        <p class="text-light/50 text-sm mb-3">${wallpaper.style || 'Artwork'}</p>

                                        <div class="flex items-center justify-between">
                                            <!-- Like Section -->
                                            <button
                                                onclick="app().handleLike(${wallpaper.id})"
                                                class="flex items-center gap-2 group/like transition-all hover:opacity-80"
                                                title="Like this wallpaper"
                                            >
                                                <span id="heart-${wallpaper.id}" class="text-2xl transition-all ${isLiked ? 'scale-125' : ''}" style="line-height: 1; display: inline-block; min-width: 24px; min-height: 24px;">
                                                    ${isLiked ? '❤️' : '🤍'}
                                                </span>
                                                <span id="like-count-${wallpaper.id}" class="text-sm font-bold ${isLiked ? 'text-orange' : 'text-light/70'}">
                                                    ${wallpaper.likes || 0}
                                                </span>
                                            </button>

                                            <!-- Download Section -->
                                            <div class="flex items-center gap-2" title="Total downloads">
                                                <span class="text-2xl" style="line-height: 1; display: inline-block; min-width: 24px; min-height: 24px;">⬇️</span>
                                                <span class="text-sm font-bold text-light/70">
                                                    ${wallpaper.downloads || 0}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    }
                },

                renderWallpapersAll() {
                    this.renderWallpapersSortButtons();
                    this.renderWallpapersGrid();
                },

                setWallpaperFilter(filter) {
                    this.wallpaperFilter = filter;
                    this.renderWallpapersAll();
                },

                setWallpaperSort(sort) {
                    this.wallpaperSort = sort;
                    this.renderWallpapersGrid();
                },

                loadShopPage() {
                    document.getElementById('shop-page').innerHTML = `
                        <div class="max-w-7xl mx-auto px-4 py-16">
                            <h1 class="text-4xl md:text-5xl font-black italic text-white mb-2">
                                MTB SHOP
                            </h1>
                            <p class="text-light/70 mb-12">
                                Merchandise and gear for passionate riders
                            </p>

                            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                <div class="text-center py-20">
                                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-orange"></div>
                                    <p class="mt-4 text-light/60">Loading products...</p>
                                </div>
                            </div>
                        </div>
                    `;
                    this.loadProducts();
                },

                async loadProducts() {
                    try {
                        const formData = new FormData();
                        formData.append('action', 'get_products');

                        const response = await fetch(this.API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        const products = await response.json();

                        const grid = document.getElementById('products-grid');
                        if (products.length === 0) {
                            grid.innerHTML = '<p class="text-light/60 text-center col-span-full">No products available</p>';
                            return;
                        }

                        grid.innerHTML = products.map(product => `
                            <div class="bg-dark-700 rounded-2xl overflow-hidden border border-light/10 hover:border-orange/50 transition-all hover:-translate-y-1">
                                <div class="aspect-square bg-dark flex items-center justify-center">
                                    ${product.image_path ?
                                        `<img src="${product.image_path}" alt="${product.name}" class="w-full h-full object-cover">` :
                                        '<span class="text-6xl">🛍️</span>'
                                    }
                                </div>
                                <div class="p-6">
                                    <h3 class="font-bold text-xl text-white mb-2">${product.name}</h3>
                                    <p class="text-light/70 text-sm mb-4">${product.description || ''}</p>
                                    <div class="flex items-center justify-between">
                                        <span class="text-2xl font-bold text-orange">${product.price} €</span>
                                        <button class="bg-orange hover:bg-orange-light text-white px-4 py-2 rounded-lg font-bold transition-all">
                                            Kaufen
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('');
                    } catch (error) {
                        console.error('Error loading products:', error);
                    }
                },

                loadLoginPage() {
                    document.getElementById('login-page').innerHTML = `
                        <div class="max-w-md mx-auto px-4 py-16">
                            <div class="bg-dark-700 rounded-2xl border border-blue/30 p-8">
                                <h2 class="text-3xl font-bold text-white mb-6 text-center">Admin Login</h2>
                                <form id="login-form" class="space-y-4">
                                    <div>
                                        <label class="block text-light/70 mb-2">Username</label>
                                        <input type="text" name="username" required
                                            class="w-full px-4 py-3 bg-dark border border-light/20 rounded-lg text-white focus:border-orange outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-light/70 mb-2">Password</label>
                                        <input type="password" name="password" required
                                            class="w-full px-4 py-3 bg-dark border border-light/20 rounded-lg text-white focus:border-orange outline-none">
                                    </div>
                                    <div id="login-error" class="text-red-500 text-sm hidden"></div>
                                    <button type="submit"
                                        class="w-full bg-orange hover:bg-orange-light text-white py-3 rounded-lg font-bold transition-all">
                                        Login
                                    </button>
                                </form>
                            </div>
                        </div>
                    `;

                    document.getElementById('login-form').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const formData = new FormData(e.target);
                        formData.append('action', 'login');

                        try {
                            const response = await fetch(this.API_URL, {
                                method: 'POST',
                                body: formData
                            });

                            const data = await response.json();

                            if (data.success) {
                                await this.checkAuth();
                                this.navigateTo('admin');
                            } else {
                                document.getElementById('login-error').textContent = data.error || 'Login failed';
                                document.getElementById('login-error').classList.remove('hidden');
                            }
                        } catch (error) {
                            console.error('Login error:', error);
                        }
                    });
                },

                loadAdminPage() {
                    document.getElementById('admin-page').innerHTML = `
                        <div class="max-w-7xl mx-auto px-4 py-16">
                            <h1 class="text-4xl font-bold text-white mb-8">Admin Dashboard</h1>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="bg-dark-700 border border-light/10 rounded-2xl p-6">
                                    <h3 class="text-xl font-bold text-white mb-2">Wallpapers</h3>
                                    <p class="text-light/70">Manage gallery wallpapers</p>
                                </div>
                                <div class="bg-dark-700 border border-light/10 rounded-2xl p-6">
                                    <h3 class="text-xl font-bold text-white mb-2">Products</h3>
                                    <p class="text-light/70">Manage shop products</p>
                                </div>
                                <div class="bg-dark-700 border border-light/10 rounded-2xl p-6">
                                    <h3 class="text-xl font-bold text-white mb-2">Stats</h3>
                                    <p class="text-light/70">View statistics</p>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }
    </script>
</body>
</html>
