<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTB Loveeeeeeee</title>
    
    <!-- Tailwind CSS (für das Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Die Engine) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (Damit der Browser JSX versteht) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    
    <style>
        body { background-color: #0a1016; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Dein React Code -->
    <script type="text/babel">
import React, { useState, useEffect } from 'react';
import { 
  Menu, X, Instagram, Facebook, 
  Download, ShoppingBag, 
  RefreshCw, Zap, Image as ImageIcon,
  Heart, Share2, Bike, User, Lock, BarChart3, Settings, LogIn, LogOut
} from 'lucide-react';

// --- KONFIGURATION ---
// Setze dies auf 'false', wenn du den PHP-Server und die MySQL-Datenbank aufgesetzt hast.
const SIMULATION_MODE = false; 
const API_URL = './api.php'; // Der Pfad zu deiner PHP-Datei

const App = () => {
  const [isMenuOpen, setIsMenuOpen] = useState(false);
  const [activeTab, setActiveTab] = useState('home');
  
  // App State (Daten kommen jetzt aus der "Datenbank")
  const [excuse, setExcuse] = useState("Klick den Button für eine Ausrede!");
  const [artworks, setArtworks] = useState([]);
  const [products, setProducts] = useState([]);
  const [adminStats, setAdminStats] = useState(null);
  const [isLoading, setIsLoading] = useState(false);
  
  // Auth State
  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [showLoginModal, setShowLoginModal] = useState(false);
  const [loginUser, setLoginUser] = useState('');
  const [loginPass, setLoginPass] = useState('');

  // Initialer Daten-Load
  useEffect(() => {
    fetchData('get_artworks').then(data => setArtworks(data || []));
    fetchData('get_products').then(data => setProducts(data || []));
  }, []);

  // --- API / BACKEND CONNECT ---
  // Diese Funktion regelt die Kommunikation zwischen React und PHP
  const fetchData = async (action, payload = {}) => {
    setIsLoading(true);
    
    // 1. SIMULATION (Für die Vorschau hier im Browser)
    if (SIMULATION_MODE) {
      await new Promise(r => setTimeout(r, 600)); // Fake Netzwerk-Latenz
      setIsLoading(false);
      
      switch(action) {
        case 'get_random_excuse':
          const excuses = [
            "Der Reifendruck war 0.05 bar zu niedrig.", "Ein Eichhörnchen hat meine Line gekreuzt.",
            "Die Sonne stand im falschen Winkel zur Gabel.", "Mein Dämpfer war im Lock-Out Modus.",
            "Das war kein Sturz, das war ein taktischer Abstieg.", "Die Gravitation war heute besonders stark."
          ];
          return { text: excuses[Math.floor(Math.random() * excuses.length)] };
        case 'get_artworks':
          return [
            { id: 1, title: 'Skull Trail', style: 'Dark Art', type: 'free' },
            { id: 2, title: 'Neon Whip', style: 'Cyberpunk', type: 'premium' },
            { id: 3, title: 'Love the Ride', style: 'Watercolor', type: 'free' },
            { id: 4, title: 'Flow State', style: 'Abstract', type: 'premium' },
          ];
        case 'get_products':
          return [
            { id: 1, name: 'T-Shirt "MTB Love"', price: '29,99 €', tag: 'Bestseller' },
            { id: 2, name: 'Sticker Pack "Heartbeat"', price: '9,99 €', tag: 'New' },
            { id: 3, name: 'Poster "Trail Dreams"', price: '19,99 €', tag: null },
          ];
        case 'login':
          if (payload.user === 'admin' && payload.pass === 'admin') return { success: true, token: 'xyz123' };
          return { success: false, message: 'Falsche Daten (Tipp: admin/admin)' };
        case 'get_admin_stats':
          return { followers: '111.2k', downloads: '4.8k', revenue: '842,50 €' };
        default: return null;
      }
    }

    // 2. ECHTER PHP REQUEST (Wenn SIMULATION_MODE = false)
    try {
      const formData = new FormData();
      formData.append('action', action);
      Object.keys(payload).forEach(key => formData.append(key, payload[key]));

      const response = await fetch(API_URL, {
        method: 'POST',
        body: formData
      });
      
      const data = await response.json();
      setIsLoading(false);
      return data;
    } catch (error) {
      console.error("Verbindungsfehler zur API:", error);
      setIsLoading(false);
      return null;
    }
  };

  // --- ACTIONS ---

  const handleGenerateExcuse = async () => {
    const data = await fetchData('get_random_excuse');
    if (data) setExcuse(data.text);
  };

  const handleLogin = async (e) => {
    e.preventDefault();
    const result = await fetchData('login', { user: loginUser, pass: loginPass });
    if (result && result.success) {
      setIsAuthenticated(true);
      setShowLoginModal(false);
      // Admin Daten laden
      const stats = await fetchData('get_admin_stats');
      setAdminStats(stats);
      setActiveTab('admin');
    } else {
      alert(result?.message || 'Login fehlgeschlagen');
    }
  };

  const handleLogout = () => {
    setIsAuthenticated(false);
    setActiveTab('home');
    setAdminStats(null);
  };

  const openAdmin = () => {
    if (isAuthenticated) {
      setActiveTab('admin');
    } else {
      setShowLoginModal(true);
    }
  };

  const renderContent = () => {
    switch(activeTab) {
      case 'art':
        return <ArtSection artworks={artworks} />;
      case 'shop':
        return <ShopSection products={products} />;
      case 'admin':
        return isAuthenticated ? <AdminSection stats={adminStats} /> : <div className="text-center py-20 text-red-500">Zugriff verweigert. Bitte einloggen.</div>;
      default:
        return <HomeSection excuse={excuse} generateExcuse={handleGenerateExcuse} setActiveTab={setActiveTab} />;
    }
  };

  return (
    <div className="min-h-screen bg-[#0a1016] text-white font-sans selection:bg-[#ed7f20] selection:text-white relative">
      
      {/* Login Modal */}
      {showLoginModal && (
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
          <div className="bg-[#0f1720] border border-[#0268a8]/50 p-8 rounded-2xl w-full max-w-md relative shadow-2xl">
            <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-[#b1dde9]/50 hover:text-white">
              <X size={24} />
            </button>
            <h2 className="text-2xl font-bold mb-6 text-center text-white">Admin Login</h2>
            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-sm text-[#b1dde9] mb-1">Username</label>
                <input 
                  type="text" 
                  value={loginUser}
                  onChange={(e) => setLoginUser(e.target.value)}
                  className="w-full bg-[#0a1016] border border-[#b1dde9]/20 rounded-lg p-3 text-white focus:border-[#ed7f20] outline-none"
                  placeholder="admin"
                />
              </div>
              <div>
                <label className="block text-sm text-[#b1dde9] mb-1">Passwort</label>
                <input 
                  type="password" 
                  value={loginPass}
                  onChange={(e) => setLoginPass(e.target.value)}
                  className="w-full bg-[#0a1016] border border-[#b1dde9]/20 rounded-lg p-3 text-white focus:border-[#ed7f20] outline-none"
                  placeholder="admin"
                />
              </div>
              <button disabled={isLoading} className="w-full bg-[#ed7f20] hover:bg-[#ffb056] text-white font-bold py-3 rounded-xl transition-all mt-2">
                {isLoading ? 'Lade...' : 'Einloggen'}
              </button>
            </form>
          </div>
        </div>
      )}

      {/* Navigation */}
      <nav className="fixed w-full z-50 bg-[#0a1016]/90 backdrop-blur-md border-b border-[#b1dde9]/10">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="flex items-center justify-between h-16">
            <div className="flex items-center cursor-pointer group" onClick={() => setActiveTab('home')}>
              <img 
                src="Gemini_Generated_Image_su3xiosu3xiosu3x.jpg" 
                alt="MTB Love Logo" 
                className="h-12 w-auto mr-3 group-hover:scale-110 transition-transform"
              />
              <span className="text-2xl font-black italic tracking-tighter text-[#0268a8]">
                MTB <span className="text-[#ed7f20]" style={{ fontFamily: 'cursive' }}>Love</span>
              </span>
            </div>
            
            <div className="hidden md:flex items-center space-x-8">
              <NavButton label="Startseite" active={activeTab === 'home'} onClick={() => setActiveTab('home')} />
              <NavButton label="Kunst" active={activeTab === 'art'} onClick={() => setActiveTab('art')} />
              <NavButton label="Shop" active={activeTab === 'shop'} onClick={() => setActiveTab('shop')} />
              
              <div className="h-6 w-px bg-[#b1dde9]/20 mx-2"></div>
              
              <div className="flex items-center space-x-4">
                <div className="flex space-x-3 text-[#b1dde9]">
                  <Instagram size={20} className="hover:text-[#ed7f20] cursor-pointer transition-colors" />
                  <Facebook size={20} className="hover:text-[#0268a8] cursor-pointer transition-colors" />
                </div>

                {isAuthenticated ? (
                  <button 
                    onClick={handleLogout}
                    className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-xs font-bold text-red-500 transition-colors"
                  >
                    <LogOut size={14} />
                    <span>LOGOUT</span>
                  </button>
                ) : (
                  <button 
                    onClick={openAdmin}
                    className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#0268a8]/10 hover:bg-[#0268a8]/20 border border-[#0268a8]/30 text-xs font-bold text-[#0268a8] transition-colors"
                  >
                    <User size={14} />
                    <span>LOGIN</span>
                  </button>
                )}
              </div>
            </div>

            <div className="md:hidden">
              <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="text-[#b1dde9] p-2 hover:text-white">
                {isMenuOpen ? <X size={24} /> : <Menu size={24} />}
              </button>
            </div>
          </div>
        </div>

        {isMenuOpen && (
          <div className="md:hidden bg-[#0a1016] border-b border-[#b1dde9]/10">
            <div className="px-2 pt-2 pb-3 space-y-1">
              <MobileNavButton label="Startseite" onClick={() => { setActiveTab('home'); setIsMenuOpen(false); }} />
              <MobileNavButton label="Kunst & Wallpaper" onClick={() => { setActiveTab('art'); setIsMenuOpen(false); }} />
              <MobileNavButton label="Shop" onClick={() => { setActiveTab('shop'); setIsMenuOpen(false); }} />
              <div className="h-px bg-[#b1dde9]/10 my-2"></div>
              <MobileNavButton label="Admin Login" onClick={() => { openAdmin(); setIsMenuOpen(false); }} icon={<Lock size={16} />} />
            </div>
          </div>
        )}
      </nav>

      <main className="pt-16">
        {renderContent()}
      </main>

      <footer className="bg-[#020b12] border-t border-[#b1dde9]/10 py-12 mt-20">
        <div className="max-w-7xl mx-auto px-4 text-center text-[#b1dde9]/60 text-sm">
          <p>© 2025 MTB Love. Powered by PHP & MySQL.</p>
        </div>
      </footer>
    </div>
  );
};

// --- Components ---

const AdminSection = ({ stats }) => (
  <div className="max-w-7xl mx-auto px-4 py-16 animate-in fade-in duration-500">
    <div className="flex items-center justify-between mb-8">
      <div>
        <h2 className="text-3xl font-bold text-white flex items-center gap-3">
          <Lock className="text-[#ed7f20]" />
          Admin Dashboard
        </h2>
        <p className="text-[#b1dde9]/70 mt-1">Echte Daten aus der MySQL Datenbank.</p>
      </div>
      <button className="bg-[#ed7f20] hover:bg-[#ffb056] text-white px-4 py-2 rounded-lg font-bold text-sm transition-colors shadow-lg">
        + Neuer Upload
      </button>
    </div>

    {/* Dashboard Stats */}
    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
      <div className="bg-[#0f1720] border border-[#b1dde9]/10 p-6 rounded-xl">
        <div className="flex items-center gap-3 mb-2 text-[#b1dde9]/60">
          <User size={20} />
          <span className="text-sm font-bold uppercase">Total Follower</span>
        </div>
        <div className="text-3xl font-black text-white">{stats?.followers || '0'}</div>
      </div>
      <div className="bg-[#0f1720] border border-[#b1dde9]/10 p-6 rounded-xl">
        <div className="flex items-center gap-3 mb-2 text-[#b1dde9]/60">
          <Download size={20} />
          <span className="text-sm font-bold uppercase">Downloads</span>
        </div>
        <div className="text-3xl font-black text-white">{stats?.downloads || '0'}</div>
      </div>
      <div className="bg-[#0f1720] border border-[#b1dde9]/10 p-6 rounded-xl">
        <div className="flex items-center gap-3 mb-2 text-[#b1dde9]/60">
          <ShoppingBag size={20} />
          <span className="text-sm font-bold uppercase">Umsatz</span>
        </div>
        <div className="text-3xl font-black text-white">{stats?.revenue || '0 €'}</div>
      </div>
    </div>
  </div>
);

const HomeSection = ({ excuse, generateExcuse, setActiveTab }) => (
  <>
    {/* Hero */}
    <div className="relative overflow-hidden py-24 lg:py-32 flex flex-col items-center text-center px-4">
      <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-[#0268a8]/20 blur-[100px] rounded-full -z-10 pointer-events-none mix-blend-screen"></div>
      <div className="absolute bottom-0 right-1/4 w-[400px] h-[400px] bg-[#ffb056]/10 blur-[80px] rounded-full -z-10 pointer-events-none mix-blend-screen"></div>
      
      <div className="inline-flex items-center space-x-2 bg-[#0268a8]/10 border border-[#0268a8]/30 rounded-full px-4 py-1.5 mb-8">
         <Heart size={14} className="text-[#ed7f20] fill-[#ed7f20]" />
         <span className="text-[#b1dde9] text-xs font-bold tracking-wide uppercase">Community & Lifestyle</span>
      </div>

      <h1 className="text-5xl md:text-8xl font-black italic tracking-tighter mb-6 text-white">
        RIDE WITH <br/>
        <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#ed7f20] via-[#ffb056] to-[#ed7f20]">PASSION</span>
      </h1>
      <p className="text-xl text-[#b1dde9]/80 max-w-2xl mb-10 font-light">
        Die Homebase für alle, die das Biken lieben. Memes, Kunst und Good Vibes only.
      </p>
      
      <div className="flex gap-4">
        <button onClick={() => setActiveTab('art')} className="px-8 py-4 bg-[#ed7f20] hover:bg-[#ffb056] text-white rounded-xl font-bold transition-all hover:scale-105 shadow-[0_0_20px_-5px_#ed7f20]">
          Zur Galerie
        </button>
        <button onClick={() => setActiveTab('shop')} className="px-8 py-4 bg-[#0268a8]/10 hover:bg-[#0268a8]/20 border border-[#0268a8]/50 text-[#b1dde9] rounded-xl font-bold transition-all">
          Zum Shop
        </button>
      </div>
    </div>

    {/* Interactive Tool */}
    <div className="max-w-4xl mx-auto px-4 py-12">
      <div className="bg-[#0f1720] rounded-3xl border border-[#0268a8]/30 p-8 md:p-12 text-center shadow-2xl relative overflow-hidden group">
        <div className="absolute -top-24 -right-24 w-64 h-64 bg-[#ed7f20]/10 rounded-full blur-3xl group-hover:bg-[#ed7f20]/20 transition-all duration-700"></div>
        <h2 className="text-3xl md:text-4xl font-bold mb-8 text-white">Der MTB Ausreden-Generator</h2>
        <div className="bg-[#0a1016] rounded-xl p-8 mb-8 min-h-[120px] flex items-center justify-center border border-[#b1dde9]/10 relative">
          <div className="absolute top-2 left-2 text-[#0268a8]/20"><Zap size={24} /></div>
          <p className="text-2xl md:text-3xl font-serif italic text-[#b1dde9]">"{excuse}"</p>
        </div>
        <button onClick={generateExcuse} className="group relative inline-flex items-center gap-3 px-8 py-4 bg-gradient-to-r from-[#0268a8] to-[#025a90] rounded-xl font-bold text-lg text-white hover:brightness-110 transition-all active:scale-95 shadow-lg shadow-[#0268a8]/30">
          <RefreshCw className="group-hover:rotate-180 transition-transform duration-500" size={20} />
          Neue Ausrede generieren
        </button>
      </div>
    </div>
  </>
);

const ArtSection = ({ artworks }) => (
  <div className="max-w-7xl mx-auto px-4 py-16">
    <div className="flex justify-between items-end mb-12">
      <h2 className="text-4xl font-black italic text-white">WALLPAPER & KUNST</h2>
    </div>
    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      {artworks.map((art) => (
        <div key={art.id} className="group relative bg-[#0f1720] rounded-2xl overflow-hidden border border-[#b1dde9]/10 hover:border-[#ed7f20]/50 transition-all hover:-translate-y-1">
          <div className="aspect-[3/4] bg-[#0a1016] relative flex items-center justify-center">
            <ImageIcon size={48} className="text-[#0268a8]/40" />
            <div className="absolute inset-0 bg-[#0268a8]/80 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
              <button className="bg-white text-[#0268a8] px-6 py-2 rounded-full font-bold flex items-center gap-2 hover:bg-[#b1dde9]"><Download size={18} /> Download</button>
            </div>
          </div>
          <div className="p-4">
            <h3 className="font-bold text-lg text-white">{art.title}</h3>
            <p className="text-[#b1dde9]/50 text-sm">{art.style}</p>
          </div>
        </div>
      ))}
    </div>
  </div>
);

const ShopSection = ({ products }) => (
  <div className="max-w-7xl mx-auto px-4 py-16">
    <h2 className="text-4xl font-black italic mb-16 text-center text-white">DER SHOP</h2>
    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
      {products.map((product) => (
        <div key={product.id} className="bg-[#0f1720] rounded-2xl p-4 border border-[#b1dde9]/10 hover:border-[#ed7f20]/50 transition-all group">
          <div className="aspect-square bg-[#0a1016] rounded-xl mb-4 relative flex items-center justify-center">
            <ShoppingBag size={48} className="text-[#0268a8]/40 group-hover:scale-110 transition-transform duration-300" />
            {product.tag && <div className="absolute top-3 right-3 bg-[#ed7f20] text-white text-xs font-bold px-3 py-1 rounded-full">{product.tag}</div>}
          </div>
          <h3 className="text-xl font-bold mb-2 text-white">{product.name}</h3>
          <div className="flex items-center justify-between mt-4">
            <span className="text-2xl font-bold text-[#ed7f20]">{product.price}</span>
            <button className="p-3 bg-white text-[#0268a8] rounded-xl hover:bg-[#ffb056] hover:text-white"><ShoppingBag size={20} /></button>
          </div>
        </div>
      ))}
    </div>
  </div>
);

// Helpers
const NavButton = ({ label, active, onClick }) => (
  <button onClick={onClick} className={`text-sm font-bold uppercase tracking-wide transition-colors ${active ? 'text-[#ed7f20]' : 'text-[#b1dde9]/60 hover:text-white'}`}>{label}</button>
);
const MobileNavButton = ({ label, onClick, icon }) => (
  <button onClick={onClick} className="flex items-center gap-3 w-full text-left px-3 py-3 rounded-lg text-base font-medium text-[#b1dde9] hover:bg-[#0268a8]/20 hover:text-white">
    {icon && <span>{icon}</span>}<span>{label}</span>
  </button>
);

export default App;
    </script>
</body>
</html>
